[package]
name = "messages"
version = "0.1.0"
edition = "2024"

# Viewer for the message archive in the `signal` MariaDB on isis. Nextcloud
# OAuth2 login, restricted to an allow-list. See README.md.

[workspace]
# The archiver writes the database this crate reads, and owns its schema;
# `irclog` is the IRC log parsing both use.
members = ["archiver", "irclog"]

[features]
# ts-rs, which exports the wire types as TypeScript (scripts/gen-types.sh). Off
# in normal builds.
ts = ["dep:ts-rs"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
axum-extra = { version = "0.12", features = ["cookie"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "chrono",
    "derive",
    "macros",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde-compat, so the exported TS honours serde renames (string unions).
ts-rs = { version = "12", optional = true, features = ["serde-compat"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# irssi autologs: the send echo writes the row the importer would.
irclog = { path = "irclog" }
rand = "0.10"
url = "2"
time = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The fleet's `[lints]` baseline (dev-lint docs/standards.md §7), for both
# crates.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

# These tables are the archiver's; tests/archive.rs carries a copy as its
# fixture, which dev-lint checks against the owner's DDL (DL-SQLX-FIXTURE-DRIFT).
[package.metadata.dev-lint]
schema_owner = "archiver"
