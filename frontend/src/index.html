<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>messages</title>
    <base href="/" />
    <!-- interactive-widget=resizes-content: the Android soft keyboard shrinks
         the LAYOUT viewport rather than sliding over the page, which is what
         keeps the composer above the keys. Without it the app looks fine
         everywhere except on a phone someone is typing on. Pinned by
         e2e/ui-pages.spec.ts, because an `ng update` rewriting this file would
         drop it in silence. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1e88e5" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <!-- mat-icon's default font family; ligatures like `search` render as glyphs. -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
