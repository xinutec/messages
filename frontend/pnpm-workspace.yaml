# Dependencies whose install scripts pnpm may run. The first four fetch or
# compile a platform binary. @xinutec/ui-harness builds itself in `prepare` and
# is keyed by its resolved codeload URL, so this line moves with the harness
# commit. A warm store hides a missing entry; test changes with
# `pnpm install --store-dir <empty dir>`.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  "@xinutec/ui-harness@https://codeload.github.com/xinutec/ui-harness/tar.gz/b23e1371e8a554872e9f0f426b598143801316ac": true

# npm-format `overrides` from package.json, which pnpm does not read.
overrides:
  esbuild: ^0.28.2
  "@babel/core": ^7.29.6

# The catalog names only versions a day old (dev-lint tables/deps.dhall);
# strict, so a younger install fails instead of writing itself an exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
