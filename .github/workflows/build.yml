---
name: build

# messages (Rust backend + Angular frontend) — gate on clippy + cargo test (DB
# integration tests run against a throwaway MariaDB) and the frontend's
# angular-eslint + unit tests + prod build + the shared phone-layout harness,
# then build + push xinutec/messages:latest to Docker Hub. The k8s manifests +
# deploy live in the home monorepo (xinutec/pippijn code/kubes/messages/k8s); the
# image tag is the only contract between this repo and the deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    # A throwaway MariaDB so the archive integration tests actually run in CI
    # (they seed + assert real queries; they skip when the env var is unset).
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: messages_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      MESSAGES_TEST_DATABASE_URL: mysql://root:root@mariadb:3306/messages_test
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=1

  fe-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx ng build --configuration production
      # Real-browser render check: icon fonts load, no text overlaps/overflow.
      - run: npx playwright install --with-deps chromium
      - run: npm run ui-check

  image:
    needs: [verify, fe-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/messages:latest
          cache-from: type=registry,ref=xinutec/messages:cache
          cache-to: type=registry,ref=xinutec/messages:cache
