---
name: build

# messages (Rust backend + Angular frontend) — gate on clippy + cargo test (DB
# integration tests run against a throwaway MariaDB) and the frontend's
# angular-eslint + unit tests + prod build + the shared phone-layout harness,
# then build + push xinutec/messages:latest to Docker Hub. The k8s manifests +
# deploy live in the home monorepo (xinutec/pippijn code/kubes/messages/k8s); the
# image tag is the only contract between this repo and the deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    # A throwaway MariaDB so the archive integration tests actually run in CI
    # (they seed + assert real queries; they skip when the env var is unset).
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: messages_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      MESSAGES_TEST_DATABASE_URL: mysql://root:root@mariadb:3306/messages_test
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      # Default (parallel) test threads, same as the local gate: the archive
      # tests seed one shared fixture instead of one per test, so they no longer
      # need serialising, and both places now exercise the same thing.
      - run: cargo test
      # The frontend's types are generated from the Rust wire types; fail if the
      # committed output drifted from them. Does in CI what scripts/check-types.sh
      # does locally, without the nix dev shell. Deleting the directory first so a
      # type REMOVED from Rust shows up as a leftover file, and asking git for
      # status rather than diff so an ADDED one (untracked) counts too — a plain
      # `git diff --exit-code` is blind to both.
      - run: rm -rf frontend/src/app/generated
      - run: cargo test --features ts export_bindings
      - name: generated types match the Rust types
        run: |
          if [ -n "$(git status --porcelain -- frontend/src/app/generated)" ]; then
            echo "generated types drifted; run scripts/gen-types.sh and commit" >&2
            git status --porcelain -- frontend/src/app/generated >&2
            git diff -- frontend/src/app/generated >&2
            exit 1
          fi

  fe-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      # Before setup-node, whose `cache: pnpm` shells out to `pnpm store path`.
      # The major floats: pinning it would be a second version held level with
      # the flake's by hand, and the lockfile is what has to match.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm exec ng build --configuration production
      # Real-browser render check: icon fonts load, no text overlaps/overflow.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ui-check

  image:
    needs: [verify, fe-verify]
    # Docker Hub auth comes from repo secrets; the GITHUB_TOKEN only reads.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/messages:latest
          cache-from: type=registry,ref=xinutec/messages:cache
          cache-to: type=registry,ref=xinutec/messages:cache
